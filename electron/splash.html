<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Sistema...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #AB0030; /* guindo-primario */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            -webkit-app-region: drag; /* Permite arrastrar la ventana */
            color: #ffffff;
        }

        .logo-container {
            position: relative;
            animation: pulse 2.5s infinite ease-in-out;
            margin-bottom: 25px;
            background-color: #ffffff;
            border-radius: 50%;
            padding: 10px; /* Borde blanco alrededor del logo */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 160px;
            height: 160px;
            border-radius: 50%; /* Hace el logo redondo */
            object-fit: cover;
        }

        .title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: #F8F2F3; /* fondo-color (clarito) */
            font-size: 15px;
            margin-bottom: 45px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Barra de progreso */
        .progress-container {
            width: 280px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.15);
        }

        .progress-bar {
            height: 100%;
            width: 5%;
            background: linear-gradient(90deg, #ffffff, #f0c0cc);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        /* Texto de estado */
        #status-text {
            margin-top: 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: opacity 0.3s ease;
        }

        /* Animaciones */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6); }
            100% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="logo.png" alt="Logo">
    </div>
    <div class="title">Casa Valluna</div>
    <div class="subtitle">Sistema de Restaurante Profesional</div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <div id="status-text">Iniciando sistema...</div>

    <script>
        const { ipcRenderer } = require('electron');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');

        ipcRenderer.on('message', (event, text) => {
            statusText.innerText = text;
        });

        ipcRenderer.on('progress', (event, percent) => {
            progressBar.style.width = percent + '%';
        });
    </script>
</body>
</html>
